<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>錢所未有｜恐怖記帳本</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,"Noto Sans TC",sans-serif;
    background:#090909;
    color:#eee;
}

header{
    background:linear-gradient(135deg,#190000,#300000,#120000);
    padding:24px 18px;
    text-align:center;
    border-bottom:2px solid #700000;
    box-shadow:0 0 25px #500000;
}

header h1{
    margin:0;
    font-size:30px;
    color:#d40000;
    text-shadow:0 0 10px #ff0000;
}

header p{
    margin:8px 0 0;
    color:#aaa;
    font-size:14px;
}

.container{
    max-width:650px;
    margin:auto;
    padding:16px;
}

.warning{
    background:#160000;
    border:1px solid #700000;
    border-radius:14px;
    padding:14px;
    margin-bottom:16px;
    color:#ddd;
    text-align:center;
}

.warning strong{
    color:#ff3333;
}

.balance{
    background:#151515;
    border:1px solid #333;
    border-radius:16px;
    padding:20px;
    text-align:center;
    margin-bottom:16px;
    box-shadow:0 0 15px #000;
}

.balance-title{
    color:#999;
    font-size:14px;
}

.balance-number{
    font-size:34px;
    font-weight:bold;
    margin-top:6px;
    color:#fff;
}

.stats{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    margin-top:15px;
}

.stat{
    background:#101010;
    border:1px solid #333;
    border-radius:12px;
    padding:12px;
}

.stat-title{
    color:#888;
    font-size:13px;
}

.income{
    color:#45d66a;
    font-size:20px;
    font-weight:bold;
    margin-top:4px;
}

.expense{
    color:#ff4b4b;
    font-size:20px;
    font-weight:bold;
    margin-top:4px;
}

.section-title{
    margin:24px 0 10px;
    color:#ddd;
    font-size:18px;
    font-weight:bold;
}

.books{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
}

.book{
    background:#141414;
    border:1px solid #333;
    border-radius:14px;
    padding:15px;
    color:#ddd;
    cursor:pointer;
    transition:.15s;
}

.book.active{
    border-color:#a00000;
    background:#250000;
    box-shadow:0 0 12px #4d0000;
}

.book-name{
    font-size:17px;
    font-weight:bold;
}

.book-balance{
    margin-top:6px;
    color:#aaa;
    font-size:14px;
}

.form{
    background:#121212;
    border:1px solid #333;
    border-radius:16px;
    padding:16px;
}

label{
    display:block;
    color:#aaa;
    font-size:13px;
    margin:12px 0 6px;
}

input,
select,
textarea{
    width:100%;
    background:#080808;
    color:#eee;
    border:1px solid #444;
    border-radius:10px;
    padding:12px;
    font-size:16px;
    outline:none;
}

input:focus,
select:focus,
textarea:focus{
    border-color:#a00000;
    box-shadow:0 0 8px #400000;
}

textarea{
    min-height:70px;
    resize:vertical;
}

.type-buttons{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
}

.type-btn{
    padding:12px;
    border-radius:10px;
    border:1px solid #444;
    background:#080808;
    color:#aaa;
    font-size:16px;
    cursor:pointer;
}

.type-btn.selected-income{
    background:#09220e;
    border-color:#1f9c3d;
    color:#57e879;
}

.type-btn.selected-expense{
    background:#250000;
    border-color:#a00000;
    color:#ff5555;
}

.add-btn{
    width:100%;
    margin-top:16px;
    border:0;
    border-radius:12px;
